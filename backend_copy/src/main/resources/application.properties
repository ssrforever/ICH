server:
    port: 8080

spring:
    datasource:
        # 注意：如果你的 MySQL 密码不是 123456，请务必修改
        url: jdbc:mysql://localhost:3306/feiyi_db?useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
        username: root
        password: 你的数据库密码
        driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置（用于简化数据库操作）
mybatis-plus:
    configuration:
        map-underscore-to-camel-case: true